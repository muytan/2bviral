    <link href="https://fonts.cdnfonts.com/css/clash-display" rel="stylesheet">

    <style>
        /* --- CORE AESTHETIC --- */
        :root {
            --bg-color: #02120a;
            --accent-color: #81ff00;
            --text-main: #ffffff;
            --text-muted: #aabeb2;
            --border-color: #1a3324;
            --card-bg: rgba(3, 31, 16, 0.85);

            /* TYPOGRAPHY */
            --font-head: 'Clash Display', 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- BACKGROUND ANIMATION --- */
        .shader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -999;
            overflow: hidden;
            background: var(--bg-color);
            pointer-events: none;
        }

        .shader-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            will-change: transform;
        }

        .orb-1 {
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(129, 255, 0, 0.15) 0%, transparent 70%);
            top: -20%;
            left: -10%;
            animation: moveOrb1 20s infinite alternate ease-in-out;
        }

        .orb-2 {
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(0, 100, 40, 0.25) 0%, transparent 70%);
            bottom: -20%;
            right: -20%;
            animation: moveOrb2 25s infinite alternate-reverse ease-in-out;
        }

        @keyframes moveOrb1 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(10%, 10%); }
        }

        @keyframes moveOrb2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-10%, -10%); }
        }

        /* --- HEADER --- */
        header {
            padding: 15px 24px;
            background: rgba(2, 18, 10, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .header-logo-img {
            height: 40px;
            width: auto;
        }

        /* --- MAIN CENTERING --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            position: relative;
            z-index: 2;
        }

        .holding-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* --- TYPOGRAPHY & LAYOUT --- */
        .section-label {
            color: var(--accent-color);
            font-family: var(--font-head);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: inline-block;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 4px;
            margin-bottom: 32px;
        }

        h1 {
            font-family: var(--font-head);
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            text-transform: uppercase;
            line-height: 1.05;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .h1-accent {
            color: var(--accent-color);
            display: block;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(26, 51, 36, 0.4);
            width: 100%;
            max-width: 240px;
            margin: 0 auto 32px auto;
        }

        .muted-line {
            color: var(--text-muted);
        }

        .line-2 {
            font-size: 0.85rem;
        }

        a {
            color: var(--accent-color);
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        /* --- FOOTER --- */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div class="shader-container">
        <div class="shader-orb orb-1"></div>
        <div class="shader-orb orb-2"></div>
    </div>

    <header>
        <img src="logo.png" alt="2BViral" class="header-logo-img">
    </header>

    <main>
        <div class="holding-content">
            <span class="section-label">UPDATING</span>
            
            <h1>
                WILL BE BACK SOON<br>
                <span class="h1-accent">when <a href="https://www.linkedin.com/in/tanagirkaya" target="_blank" rel="noopener noreferrer">tan</a> has the time.</span>
            </h1>
            
            <hr>
            
            <p class="muted-line line-2">
                &rarr; <a href="https://twitter.com/tan2bviral" target="_blank" rel="noopener noreferrer">ask anything</a>
            </p>
        </div>
    </main>

    <footer>
        2026 © 2BViral
    </footer>

</body>
</html>
